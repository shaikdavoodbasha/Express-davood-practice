```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My File Manager</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }


        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }


        h1 {
            margin-bottom: 25px;
        }


        #fileList {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }


        .file {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px;

            border: 1px solid #ddd;
            border-radius: 10px;
        }


        .file-name {
            font-size: 16px;
            font-weight: 500;
        }


        .buttons {
            display: flex;
            gap: 8px;
        }


        button {
            border: none;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }


        .open {
            background: #e8e8e8;
        }


        .download {
            background: #222;
            color: white;
        }


        .rename {
            background: #eee;
        }


        .delete {
            background: #ff4444;
            color: white;
        }


        button:hover {
            opacity: 0.8;
        }


        .empty {
            padding: 30px;
            text-align: center;
            color: #777;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>📁 My File Manager</h1>

        <div id="fileList">
            Loading files...
        </div>

    </div>



    <script>


        const API = "http://localhost:4000";


        // Get files
        async function getFiles() {

            try {

                const response =
                    await fetch(API);

                const files =
                    await response.json();

                const fileList =
                    document.getElementById("fileList");


                fileList.innerHTML = "";


                if (files.length === 0) {

                    fileList.innerHTML =
                        `<div class="empty">
                            No files found
                        </div>`;

                    return;
                }


                files.forEach(file => {

                    const fileElement =
                        document.createElement("div");

                    fileElement.className = "file";


                    fileElement.innerHTML = `

                        <span class="file-name">
                            📄 ${file}
                        </span>


                        <div class="buttons">

                            <button
                                class="open"
                                onclick="openFile('${file}')">
                                Open
                            </button>


                            <button
                                class="download"
                                onclick="downloadFile('${file}')">
                                Download
                            </button>


                            <button
                                class="rename"
                                onclick="renameFile('${file}')">
                                Rename
                            </button>


                            <button
                                class="delete"
                                onclick="deleteFile('${file}')">
                                Delete
                            </button>

                        </div>

                    `;


                    fileList.appendChild(fileElement);

                });


            } catch (error) {

                console.log(error);

                document.getElementById("fileList").innerHTML =
                    "Failed to load files.";

            }

        }



        // Open file
        function openFile(file) {

            window.open(
                `${API}/${encodeURIComponent(file)}`,
                "_blank"
            );

        }



        // Download file
        function downloadFile(file) {

            window.open(
                `${API}/${encodeURIComponent(file)}?action=download`,
                "_blank"
            );

        }



        // Delete file
        async function deleteFile(file) {

            const confirmed =
                confirm(`Are you sure you want to delete "${file}"?`);


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API}/${encodeURIComponent(file)}`,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.json();


                alert(result.message);


                // Refresh file list
                getFiles();


            } catch (error) {

                alert("Failed to delete file.");

            }

        }



        // Rename file
        async function renameFile(file) {

            const newName =
                prompt(
                    "Enter new file name:",
                    file
                );


            if (!newName || newName === file) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API}/${encodeURIComponent(file)}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                newName: newName
                            })
                        }
                    );


                const result =
                    await response.json();


                alert(result.message);


                // Refresh files
                getFiles();


            } catch (error) {

                alert("Failed to rename file.");

            }

        }



        // Load files when page opens
        getFiles();


    </script>

</body>

</html>
```
